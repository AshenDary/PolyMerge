# Application-only template. Provision graph privately before starting these services.
# Loopback bindings are for an authenticated TLS reverse proxy or SSH tunnel.
services:
  backend:
    image: polymerge-backend:${RELEASE_SHA:?Set reviewed release SHA}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ML_SERVICE_URL: http://ml:8000
      ML_CANDIDATE_TIMEOUT_MS: 150000
      ML_HEALTH_TIMEOUT_MS: 5000
      ML_CATALOG_TIMEOUT_MS: 10000
      CORS_ORIGIN: ${FRONTEND_ORIGIN:?Set HTTPS frontend origin}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      ml:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  ml:
    image: polymerge-ml:${RELEASE_SHA:?Set reviewed release SHA}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ml
    environment:
      NEO4J_URI: ${NEO4J_URI:?Set private graph URI}
      NEO4J_USER: ${NEO4J_USER:?Set graph username}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set graph password}
      POLYMERGE_DDI_MODEL_PATH: /model/random_forest_ddi_pipeline.joblib
    volumes:
      - type: bind
        source: ${MODEL_DIRECTORY:?Set trusted private model directory}
        target: /model
        read_only: true
        bind:
          create_host_path: false
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  streamlit:
    image: polymerge-streamlit:${RELEASE_SHA:?Set reviewed release SHA}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.streamlit
    environment:
      POLYMERGE_FRONTEND_URL: ${FRONTEND_ORIGIN:?Set HTTPS frontend origin}
    ports: ["127.0.0.1:8501:8501"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
