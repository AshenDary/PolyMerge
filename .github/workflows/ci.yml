name: PolyMerge CI
on:
  pull_request:
    branches: [main, 'integration/pre-deployment-main-sync']
  push:
    branches: [main, 'sprint6/jared/final-audit-cicd', 'sprint6/jared/performance-guided-ux', 'fix/polymerge-availability-and-rule-mapping']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Native Windows process containment and path tests
        run: python -m unittest discover -s scripts/tests -p test_local_demo.py -v
      - name: Check separate Windows locked environments
        run: |
          python -m venv .venv-demo-ml
          .venv-demo-ml/Scripts/python -m pip install --require-hashes -r ml_engine/requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv-demo-ml/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv-demo-ui
          .venv-demo-ui/Scripts/python -m pip install --require-hashes -r requirements-streamlit.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv-demo-ui/Scripts/python -m pip check
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml_engine/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: pip install --require-hashes -r ml_engine/requirements-dev.lock
      - run: python -m pytest -q
        working-directory: ml_engine
      - run: python scripts/validate_sprint4_contract.py
      - run: python scripts/check_release_metadata.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: node --check frontend/app.js && node --check frontend/explainability.js
      - run: git diff --check
      - name: Reject tracked runtime secrets and binary models
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.(joblib|pkl|pem|key)$'; then
            echo 'Forbidden runtime artifact tracked'; exit 1
          fi
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - if: ${{ !cancelled() }}
        run: pip install pip-audit==2.9.0
      - if: ${{ !cancelled() }}
        run: pip-audit -r ml_engine/requirements.lock
      - if: ${{ !cancelled() }}
        run: pip-audit -r requirements-streamlit.lock
      - if: ${{ !cancelled() }}
        run: pip-audit -r ml_engine/requirements-dev.lock
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ml, streamlit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build only; never publish
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build -f "deploy/Dockerfile.$SERVICE" -t "polymerge-$SERVICE:ci" .
      - name: Container liveness without production secrets or model
        env:
          SERVICE: ${{ matrix.service }}
        run: bash scripts/check_container_runtime.sh "polymerge-$SERVICE:ci" "$SERVICE"
      - name: Scan runtime image vulnerabilities without suppressions
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD:/reports" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            --list-all-pkgs --format json --output "/reports/security-$SERVICE.json" "polymerge-$SERVICE:ci"
      - name: Retain primary scanner database timestamps
        if: ${{ !cancelled() }}
        env:
          SERVICE: ${{ matrix.service }}
        run: cp "$RUNNER_TEMP/trivy-cache/db/metadata.json" "trivy-db-$SERVICE.json"
      - name: Independent Grype policy check
        if: ${{ !cancelled() }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$PWD:/reports" \
            anchore/grype@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe \
            "docker:polymerge-$SERVICE:ci" --fail-on high -o json --file "/reports/security-grype-$SERVICE.json"
      - name: Retain complete package inventory and vulnerability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-${{ matrix.service }}
          path: |
            security-${{ matrix.service }}.json
            security-grype-${{ matrix.service }}.json
            trivy-db-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 30
