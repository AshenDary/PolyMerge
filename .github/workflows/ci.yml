name: PolyMerge CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'sprint6/jared/final-audit-cicd', 'sprint6/jared/performance-guided-ux']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml_engine/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: pip install -r ml_engine/requirements.txt
      - run: python -m pytest -q
        working-directory: ml_engine
      - run: python scripts/validate_sprint4_contract.py
      - run: python scripts/check_release_metadata.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: node --check frontend/app.js && node --check frontend/explainability.js
      - run: git diff --check
      - name: Reject tracked runtime secrets and binary models
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.(joblib|pkl|pem|key)$'; then
            echo 'Forbidden runtime artifact tracked'; exit 1
          fi
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - if: ${{ !cancelled() }}
        run: pip install pip-audit==2.9.0
      - if: ${{ !cancelled() }}
        run: pip-audit -r ml_engine/requirements.txt -r requirements-streamlit.txt
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        service: [backend, ml, streamlit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build only; never publish
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build -f "deploy/Dockerfile.$SERVICE" -t "polymerge-$SERVICE:ci" .
      - name: Container liveness without production secrets or model
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          id=$(docker run -d "polymerge-$SERVICE:ci")
          trap 'docker logs "$id"; docker rm -f "$id"' EXIT
          for attempt in $(seq 1 30); do
            running=$(docker inspect --format '{{.State.Running}}' "$id")
            if [ "$running" != true ]; then exit 1; fi
            state=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            if [ "$state" = healthy ]; then exit 0; fi
            sleep 5
          done
          exit 1
